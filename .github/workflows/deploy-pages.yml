name: Deploy customer preview site

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website files
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site artifact
        run: |
          rm -rf _site
          mkdir _site
          cp index.html styles.css script.js README.md _site/
          touch _site/.nojekyll

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy clickable preview link
        id: deployment
        uses: actions/deploy-pages@v4
